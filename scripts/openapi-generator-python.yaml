# openapi-generator config for the PUBLIC Python customer SDK.
#
# Generator : python  (urllib3-based, supports OpenAPI 3.1)
# Input     : spec/openapi.public.json  (the 3.1 customer surface)
# Output    : python/
#
# The package carries NO admin/worker/internal operations — it is generated
# from the public spec. Regenerated by scripts/regen.sh; never hand-edited.
#
# The metadata patches below (packageUrl, infoName, infoEmail, licenseInfo)
# are applied AT GENERATION TIME so the published author/license/repo survive
# every regen — they are deliberately NOT hand-edited into pyproject.toml /
# setup.py. The OpenAPI document's `info.version` (currently "dev") is fixed at
# the BACKEND; scripts/regen.sh overrides packageVersion from the root VERSION
# file via an --additional-properties flag so the dist version is authoritative.
packageName: inoue_ai_sdk
projectName: inoue-ai-sdk
packageVersion: 0.1.0
library: urllib3
generateSourceCodeOnly: false
additionalProperties:
  # Distribution / import identity.
  packageName: inoue_ai_sdk
  projectName: inoue-ai-sdk
  # Published metadata (replaces the OpenAPI-Generator-community placeholders).
  infoName: Inoue AI
  infoEmail: engineering@inoue.ai
  packageUrl: https://github.com/Inoue-AI/Inoue-AI-SaaS-SDK
  licenseInfo: MIT
# gitUserId / gitRepoId feed the pyproject.toml `repository` field (the
# `python` generator's poetry template uses these, not packageUrl). Setting
# them replaces the GIT_USER_ID/GIT_REPO_ID placeholders.
gitUserId: Inoue-AI
gitRepoId: Inoue-AI-SaaS-SDK
