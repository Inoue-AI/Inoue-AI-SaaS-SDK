# oapi-codegen config for the PUBLIC Go customer SDK.
#
# Input  : spec/openapi.public-3.0.json  (the 3.0.3 downgrade — oapi-codegen
#          does not yet support OpenAPI 3.1; see oapi-codegen#373).
# Output : go/inoueai/client.gen.go  (typed models + a std-net/http client).
#
# The package is `inoueai` and lives in the standalone `go/` module
# (github.com/Inoue-AI/Inoue-AI-SaaS-SDK/go) so the generated client builds
# WITHOUT pulling any backend internal packages. Regenerated by
# scripts/regen.sh; never hand-edited.
#
# `client` (not `chi-server`/`echo-server`) emits a customer-facing HTTP
# client. `models` emits the request/response structs from components.schemas.
# The bearer security scheme is honoured via the generated request editors —
# callers attach a token with a RequestEditorFn (or the hand-written
# WithBearerToken convenience in go/inoueai/auth.go).
#
# The output path is passed on the command line (`-o`, absolute) by
# scripts/regen.sh rather than set here, so this config is independent of the
# directory oapi-codegen is invoked from (it runs in a throwaway sandbox module
# with GOWORK=off so the Go SDK module's pinned go.mod/go.sum stays untouched).
package: inoueai
generate:
  models: true
  client: true
output-options:
  # Keep the generated file self-contained + skip the prune so every schema
  # in components.schemas (some are response-envelope-only) is emitted.
  skip-prune: true
  skip-fmt: false
