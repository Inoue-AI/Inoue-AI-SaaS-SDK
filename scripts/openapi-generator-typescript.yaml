# openapi-generator config for the PUBLIC TypeScript customer SDK.
#
# Generator : typescript-fetch  (fetch-based, framework-agnostic, supports
#             OpenAPI 3.1)
# Input     : spec/openapi.public.json  (the 3.1 customer surface)
# Output    : typescript/
#
# The package carries NO admin/worker/internal operations — it is generated
# from the public spec. Regenerated by scripts/regen.sh; never hand-edited.
#
# The metadata patches below (npmRepository, npmAuthor) are applied AT
# GENERATION TIME so the published repo/author survive every regen — they are
# deliberately NOT hand-edited into package.json. scripts/regen.sh overrides
# npmVersion from the root VERSION file via an --additional-properties flag so
# the published version is authoritative.
npmName: "@inoue-ai/sdk"
npmVersion: 0.1.0
supportsES6: true
# typescriptThreePlus enables modern TS output (string-literal enums, strict
# null types) consistent with the consumer frontend's `strict: true` tsconfig.
typescriptThreePlus: true
withInterfaces: true
additionalProperties:
  npmName: "@inoue-ai/sdk"
  licenseName: MIT
# gitUserId / gitRepoId replace the GIT_USER_ID/GIT_REPO_ID placeholders in the
# generated package.json `repository.url`.
#
# NOTE: `npmRepository` is intentionally NOT set — for the typescript-fetch
# generator it controls `publishConfig.registry` (the npm registry to publish
# TO), not the source repo. Leaving it unset lets `npm publish` use the default
# npmjs.org registry (the publish workflow sets registry-url explicitly). The
# package.json `author` field is a non-configurable template literal in this
# generator, so scripts/regen.sh post-patches it deterministically to
# "Inoue AI <engineering@inoue.ai>".
gitUserId: Inoue-AI
gitRepoId: Inoue-AI-SaaS-SDK
